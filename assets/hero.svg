<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300" role="img" aria-label="Assay — verifiable AI evaluation">
  <style>
    .bg { fill:#FAF8F3; stroke:#E6E0D3; stroke-width:1.5; }
    .ink { fill:#1C1B18; } .brass { fill:#7C561A; } .mut { fill:#57544D; }
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .mono { font-family: ui-monospace, 'Courier New', monospace; }

    .hm-box { stroke:#A8792C; stroke-width:5; fill:none; stroke-linecap:round;
      stroke-dasharray:400; stroke-dashoffset:400; animation: draw 1.1s ease-out forwards; }
    .hm-t { stroke:#A8792C; stroke-width:6; fill:none; stroke-linecap:round;
      stroke-dasharray:40; stroke-dashoffset:40; }
    .t1 { animation: draw .45s ease-out .9s forwards; }
    .t2 { animation: draw .45s ease-out 1.1s forwards; }
    .t3 { animation: draw .45s ease-out 1.3s forwards; }
    .hallmark { animation: pulse 4s ease-in-out 4s infinite; transform-origin: 120px 150px; }

    .title { opacity:0; animation: rise .7s ease-out 1.5s forwards; }
    .kicker { opacity:0; animation: rise .7s ease-out 1.9s forwards; }
    .cover { animation: type 2.1s steps(42,end) 2.3s forwards; }
    .caret { animation: blink 0.9s steps(1) 2.3s 8, fade .3s linear 9.5s forwards; }
    .pill { opacity:0; }
    .p1 { animation: pop .5s cubic-bezier(.2,.9,.3,1.2) 4.5s forwards; }
    .p2 { animation: pop .5s cubic-bezier(.2,.9,.3,1.2) 4.8s forwards; }
    .p3 { animation: pop .5s cubic-bezier(.2,.9,.3,1.2) 5.1s forwards; }

    @keyframes draw { to { stroke-dashoffset:0; } }
    @keyframes rise { from { opacity:0; transform: translateY(10px);} to { opacity:1; transform:none; } }
    @keyframes type { from { transform: translateX(0);} to { transform: translateX(620px);} }
    @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }
    @keyframes fade { to { opacity:0; } }
    @keyframes pop { from { opacity:0; transform: translateY(8px) scale(.96);} to { opacity:1; transform:none;} }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.72; } }
  </style>

  <rect class="bg" x="1" y="1" width="938" height="298" rx="18"/>

  <!-- hallmark -->
  <g class="hallmark">
    <rect class="hm-box" x="66" y="96" width="108" height="108" rx="30"/>
    <line class="hm-t t1" x1="99"  y1="176" x2="107" y2="157"/>
    <line class="hm-t t2" x1="116" y1="176" x2="128" y2="147"/>
    <line class="hm-t t3" x1="133" y1="176" x2="149" y2="135"/>
  </g>

  <!-- wordmark -->
  <g class="title">
    <text class="serif ink" x="212" y="146" font-size="58" font-weight="bold" letter-spacing="2">ASSAY</text>
  </g>
  <g class="kicker">
    <text class="mono brass" x="216" y="176" font-size="13" letter-spacing="5">THE ASSAY OFFICE FOR AI</text>
  </g>

  <!-- typewriter tagline -->
  <g>
    <text class="mono mut" x="216" y="212" font-size="16">Verifiable AI evaluation — measure, then prove it.</text>
    <rect class="cover" x="214" y="196" width="640" height="24" fill="#FAF8F3"/>
    <rect class="caret" x="216" y="197" width="9" height="20" fill="#7C561A" opacity="0"/>
  </g>

  <!-- stat pills -->
  <g class="pill p1">
    <rect x="216" y="236" width="200" height="40" rx="11" fill="#FFFFFF" stroke="#E6E0D3"/>
    <text class="serif brass" x="316" y="262" font-size="16" font-weight="bold" text-anchor="middle">τ 0.948 @ 60 items</text>
  </g>
  <g class="pill p2">
    <rect x="428" y="236" width="200" height="40" rx="11" fill="#FFFFFF" stroke="#E6E0D3"/>
    <text class="serif brass" x="528" y="262" font-size="16" font-weight="bold" text-anchor="middle">+3.9 → 0.0 ranks</text>
  </g>
  <g class="pill p3">
    <rect x="640" y="236" width="212" height="40" rx="11" fill="#FFFFFF" stroke="#E6E0D3"/>
    <text class="serif brass" x="746" y="262" font-size="16" font-weight="bold" text-anchor="middle">€0 → €414 + proof</text>
  </g>

  <!-- bitcoin-attested ribbon -->
  <g class="pill p3">
    <text class="mono mut" x="216" y="292" font-size="11">SHA-256 anchored on Bitcoin via OpenTimestamps · working paper v0.2 · 2026</text>
  </g>
</svg>
