name: OTS proof upgrade
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install opentimestamps-client
      - name: Upgrade OpenTimestamps proof
        run: ots upgrade paper/Assay_Whitepaper_EN.pdf.ots || true
      - name: Commit if changed
        run: |
          if ! git diff --quiet; then
            git config user.name  "Nicola Finazzi"
            git config user.email "Nicola-Fit-Social@users.noreply.github.com"
            git add paper/*.ots
            git commit -m "chore: upgrade OpenTimestamps proof (Bitcoin attestation)"
            git push
          fi
